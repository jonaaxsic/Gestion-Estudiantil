<div class="stats-grid">
  <div class="stat-card" (click)="selectCurso.emit()">
    <div class="stat-icon cursos"><span class="material-icons">class</span></div>
    <div class="stat-value">{{ data.cursosAsignados().length }}</div>
    <div class="stat-label">Cursos Asignados</div>
  </div>
  <div class="stat-card">
    <div class="stat-icon estudiantes"><span class="material-icons">groups</span></div>
    <div class="stat-value">{{ data.estudiantes().length }}</div>
    <div class="stat-label">Estudiantes</div>
  </div>
  <div class="stat-card">
    <div class="stat-icon evaluaciones"><span class="material-icons">assignment</span></div>
    <div class="stat-value">{{ data.evaluaciones().length }}</div>
    <div class="stat-label">Evaluaciones</div>
  </div>
  <div class="stat-card">
    <div class="stat-icon recordatorios"><span class="material-icons">notifications</span></div>
    <div class="stat-value">{{ data.recordatorios().length }}</div>
    <div class="stat-label">Recordatorios</div>
  </div>
</div>
