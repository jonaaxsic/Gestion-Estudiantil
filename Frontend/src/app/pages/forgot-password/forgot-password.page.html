<div class="auth-container">
  <button class="theme-toggle-btn" (click)="theme.toggle()" [title]="theme.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
    <span class="material-icons">{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</span>
  </button>
  
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">
        <span class="material-icons">lock_reset</span>
      </div>
      <h1 class="auth-title">Recuperar Contraseña</h1>
      <p class="auth-subtitle">Ingresa tu correo electrónico y te enviaremos un código de verificación</p>
    </div>
    
    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label class="form-label">Correo electrónico</label>
        <div class="input-wrapper">
          <span class="material-icons input-icon">email</span>
          <input 
            type="email" 
            class="form-input" 
            [(ngModel)]="email" 
            name="email" 
            placeholder="correo@colegio.cl"
            [disabled]="loading()"
            autofocus
          >
        </div>
      </div>
      
      @if (error()) {
        <div class="error-message">
          <span class="material-icons">error</span>
          {{ error() }}
        </div>
      }
      
      @if (success()) {
        <div class="success-message">
          <span class="material-icons">check_circle</span>
          {{ success() }}
        </div>
      }
      
      <button type="submit" class="btn btn-primary auth-btn" [disabled]="loading()">
        @if (loading()) {
          <div class="spinner"></div>
        } @else {
          <span>Enviar Código</span>
          <span class="material-icons">send</span>
        }
      </button>
    </form>
    
    <div class="auth-footer">
      <p><a routerLink="/login"><span class="material-icons">arrow_back</span> Volver al inicio de sesión</a></p>
    </div>
  </div>
</div>
