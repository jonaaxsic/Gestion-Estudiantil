name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd Frontend
          npm ci

      - name: Run Tests
        run: |
          cd Frontend
          npx ng test --watch=false

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [test]  # Solo deploy si los tests pasan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd Frontend
          npm ci

      - name: Build
        run: |
          cd Frontend
          npm run build

      - name: Copy _routes.json to dist
        run: |
          cd Frontend
          cp public/_routes.json dist/cloudflare/browser/_routes.json

      - name: Build Functions Worker
        run: |
          cd Frontend
          npx wrangler pages functions build functions --outdir dist/cloudflare/browser

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/cloudflare/browser --project-name gestionestudiantil
